<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-straight/css/uicons-regular-straight.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>My Dashboard</title>
</head>
<body>
    <h1>Mi DashBoard</h1>


<nav id="links-widgets">
    <ul>
        <li><a href="reloj.html"><i class="fi fi-rs-clock-three"></i></i></a></li>
        <li><a href="clima.html"><i class="fi fi-rs-temperature-low"></i></a></li>
        <li><a href="passwords.html"><i class="fi fi-rs-lock"></i></a></li>
        <li><a href="links.html"><i class="fi fi-rs-link-alt"></i></a></li>
    </ul>

</nav> 

    <div id="container-general">

         <div id="DashBoard">


        <section id="widget-reloj">


            <h2>Son las...</h2>
            
                <div id="watch"></div>
                <div id="calendar"></div>
                <div id="frase"></div>
                


        </section>

        <section id="widget-clima">


            <h2>Madrid</h2>
            <div id="climaAhoraContainer"></div>
            <div id="climaSemanaContainer"></div>
            <div id="error" role="alert" hidden></div>

        </section>

        <section id="widget-password">


            <h2>Generador de contraseñas</h2>
            <input type="number" id="longitud"  value="12" min="12" max="50">
            <button onclick="generarPass()" id="btn-pass">Generar contraseña</button>
            <p id="mostrarPassword"></p>

        </section>

        <section id="widget-links">


            <h2>Mis links favoritos</h2>
            <input id="inputTitulo" placeholder="Título del link">
            <input id="inputURL" placeholder="URL del link">
            <button id="btnAdd">Añade Links</button>
            <div id="listaLinks"></div>


        </section>

    </div>

    </div>




<script src="JS/cambio-fondo.js"></script>
<script src="JS/scriptLinks.js"></script>
<script src="JS/scriptClima.js"></script>
<script src="JS/scriptfechayhora.js"></script>
<script src="JS/scriptpasswordSeguro.js"></script>
</body>
</html>
